<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Layered architecture vs Vertical Slice Architecture</title>
  <desc id="desc">On the left, a layered architecture where one feature cuts across four horizontal layers. On the right, vertical slices where each use case is a self-contained column standing on a thin shared base.</desc>

  <rect x="0" y="0" width="960" height="420" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="none" stroke="#e5e7eb"/>

  <!-- ============ LEFT: Layered ============ -->
  <text x="240" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Layered (horizontal)</text>

  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="50" y="72" width="380" height="56" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="140" y="105" fill="#3730a3">Presentation</text>
    <rect x="50" y="138" width="380" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="140" y="171" fill="#1e40af">Application</text>
    <rect x="50" y="204" width="380" height="56" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="140" y="237" fill="#075985">Domain</text>
    <rect x="50" y="270" width="380" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="140" y="303" fill="#334155">Infrastructure</text>
  </g>

  <!-- one feature cutting through every layer -->
  <rect x="290" y="64" width="96" height="270" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-size="11" text-anchor="middle" fill="#92400e" font-weight="600">
    <text x="338" y="104">Controller</text>
    <text x="338" y="170">Service</text>
    <text x="338" y="236">Entity</text>
    <text x="338" y="302">Repository</text>
  </g>

  <text x="240" y="368" text-anchor="middle" font-size="13" fill="#4b5563">One feature change touches</text>
  <text x="240" y="387" text-anchor="middle" font-size="13" fill="#4b5563">files in <tspan font-weight="700" fill="#b45309">every layer</tspan></text>

  <!-- divider -->
  <line x1="480" y1="40" x2="480" y2="390" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ============ RIGHT: Vertical slices ============ -->
  <text x="720" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Vertical slices</text>

  <g font-size="10.5" text-anchor="middle">
    <!-- slice template: column 76 wide, gap 6, starting x=518 -->
    <g>
      <rect x="518" y="72" width="76" height="218" rx="8" fill="#dcfce7" stroke="#86efac"/>
      <text x="556" y="94" font-weight="700" fill="#166534">CreateTodo</text>
      <rect x="526" y="108" width="60" height="44" rx="5" fill="#ffffff" stroke="#bbf7d0"/><text x="556" y="134" fill="#166534">Endpoint</text>
      <rect x="526" y="160" width="60" height="44" rx="5" fill="#ffffff" stroke="#bbf7d0"/><text x="556" y="186" fill="#166534">Validator</text>
      <rect x="526" y="212" width="60" height="44" rx="5" fill="#ffffff" stroke="#bbf7d0"/><text x="556" y="238" fill="#166534">Handler</text>
    </g>
    <g>
      <rect x="600" y="72" width="76" height="218" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="638" y="94" font-weight="700" fill="#1e40af">GetTodos</text>
      <rect x="608" y="108" width="60" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe"/><text x="638" y="134" fill="#1e40af">Endpoint</text>
      <rect x="608" y="160" width="60" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe"/><text x="638" y="186" fill="#1e40af">Query</text>
      <rect x="608" y="212" width="60" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe"/><text x="638" y="238" fill="#1e40af">Handler</text>
    </g>
    <g>
      <rect x="682" y="72" width="76" height="218" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="720" y="94" font-weight="700" fill="#92400e">CompleteTodo</text>
      <rect x="690" y="108" width="60" height="44" rx="5" fill="#ffffff" stroke="#fde68a"/><text x="720" y="134" fill="#92400e">Endpoint</text>
      <rect x="690" y="160" width="60" height="44" rx="5" fill="#ffffff" stroke="#fde68a"/><text x="720" y="186" fill="#92400e">Validator</text>
      <rect x="690" y="212" width="60" height="44" rx="5" fill="#ffffff" stroke="#fde68a"/><text x="720" y="238" fill="#92400e">Handler</text>
    </g>
    <g>
      <rect x="764" y="72" width="76" height="218" rx="8" fill="#fce7f3" stroke="#f9a8d4"/>
      <text x="802" y="94" font-weight="700" fill="#9d174d">Login</text>
      <rect x="772" y="108" width="60" height="44" rx="5" fill="#ffffff" stroke="#fbcfe8"/><text x="802" y="134" fill="#9d174d">Endpoint</text>
      <rect x="772" y="160" width="60" height="44" rx="5" fill="#ffffff" stroke="#fbcfe8"/><text x="802" y="186" fill="#9d174d">Validator</text>
      <rect x="772" y="212" width="60" height="44" rx="5" fill="#ffffff" stroke="#fbcfe8"/><text x="802" y="238" fill="#9d174d">Handler</text>
    </g>
    <g>
      <rect x="846" y="72" width="76" height="218" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="884" y="94" font-weight="700" fill="#5b21b6">Register</text>
      <rect x="854" y="108" width="60" height="44" rx="5" fill="#ffffff" stroke="#ddd6fe"/><text x="884" y="134" fill="#5b21b6">Endpoint</text>
      <rect x="854" y="160" width="60" height="44" rx="5" fill="#ffffff" stroke="#ddd6fe"/><text x="884" y="186" fill="#5b21b6">Validator</text>
      <rect x="854" y="212" width="60" height="44" rx="5" fill="#ffffff" stroke="#ddd6fe"/><text x="884" y="238" fill="#5b21b6">Handler</text>
    </g>
  </g>

  <!-- shared base -->
  <rect x="518" y="298" width="404" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="720" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Common · Database · Authentication · Authorization</text>

  <text x="720" y="368" text-anchor="middle" font-size="13" fill="#4b5563">One feature change stays</text>
  <text x="720" y="387" text-anchor="middle" font-size="13" fill="#4b5563">inside <tspan font-weight="700" fill="#15803d">one file</tspan></text>
</svg>
